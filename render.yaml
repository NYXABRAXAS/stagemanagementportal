# Render Blueprint — ProHorizon LOS Stage Management Portal (demo / team preview)
# Creates ONE new PostgreSQL database and ONE new web service. Existing services are not affected.
# Render: New → Blueprint → select this repository → Apply.

databases:
  - name: los-portal-db
    plan: free              # Render allows one free Postgres per workspace; if you already have one, use basic-256mb
    region: singapore
    databaseName: los_stage_portal
    user: los_portal
    ipAllowList: []          # only reachable from Render services in this account (no public access)

services:
  - type: web
    name: los-stage-portal
    runtime: node
    plan: free              # free sleeps after 15 min idle; use starter to keep it awake
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    # Migrations + seed run at start (the seed is idempotent and never overwrites edited configuration)
    startCommand: npm run db:deploy && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: los-portal-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: API_PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_HOURS
        value: "8"
      - key: SEED_DEMO_PASSWORD
        sync: false          # Render asks you for this value when you apply the Blueprint
