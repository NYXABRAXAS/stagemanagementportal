# nginx reverse proxy for the LOS Stage Management Portal (Linux office server)
# Copy to /etc/nginx/conf.d/los-portal.conf, adjust server_name and certificate paths, then:
#   sudo nginx -t && sudo systemctl reload nginx
# Set COOKIE_SECURE=true in server/.env when serving over HTTPS.

server {
    listen 80;
    server_name los-portal.internal.example;          # internal DNS name or server IP
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name los-portal.internal.example;

    ssl_certificate     /etc/ssl/los-portal/los-portal.crt;   # internal CA or corporate certificate
    ssl_certificate_key /etc/ssl/los-portal/los-portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;

    # Optional: restrict to the office network
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
